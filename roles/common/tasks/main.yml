---
- name: Добавить ключ репозитория PostgreSQL
  ansible.builtin.apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Добавить репозиторий PostgreSQL 16
  apt_repository:
    repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    filename: pgdg

- name: Обновление кеша apt
  apt:
    update_cache: yes

- name: Установка PostgreSQL 16 и утилит
  apt:
    name:
      - postgresql-16
      - postgresql-client-16
      - postgresql-contrib-16
      - python3-psycopg2
      - vim
      - curl
      - wget
    state: present
    update_cache: yes